# XcodeGen spec for the prebuilt binary frameworks.
#
# The package itself is built with SwiftPM (Package.swift). This spec exists only so that CI can build
# XCFrameworks that deploy back to macOS 10.11: Xcode applies a 10.13 deployment-target floor to Swift
# packages it builds from source, but not to a prebuilt framework.
#
# The Xcode project is generated from this file and is never committed (*.xcodeproj is ignored):
#
#     xcodegen generate
#
# Scripts/build-xcframeworks.sh does that, archives the three frameworks and packs the XCFrameworks.
#
# Deployment targets: SerialPortSwift and SerialPortSwiftSimulation deploy back to macOS 10.11.
# SerialPortSwiftConcurrency is the exception, with its own minimum of macOS 10.15, the first system that can run
# Swift concurrency. It is a separate framework so that the other two never link the Swift concurrency runtime.
# Scripts/build-xcframeworks.sh holds the minimum it expects of each framework and fails if a binary disagrees.

name: SerialPortSwift

options:
  bundleIdPrefix: io.github.omarzl

settingGroups:
  Distribution:
    # The floor of SerialPortSwift and SerialPortSwiftSimulation. SerialPortSwiftConcurrency overrides it below.
    MACOSX_DEPLOYMENT_TARGET: "10.11"
    SWIFT_VERSION: "5.0"
    # Library evolution: ship a .swiftinterface so the frameworks stay usable across compiler versions.
    BUILD_LIBRARY_FOR_DISTRIBUTION: "YES"
    GENERATE_INFOPLIST_FILE: "YES"
    DEFINES_MODULE: "YES"
    # The frameworks are installed into the archive, which the XCFrameworks are packed from.
    SKIP_INSTALL: "NO"
    # Universal binary: arm64 and x86_64.
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: "NO"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

# The group applies to the project and, below, to every target. XcodeGen sets its own defaults for a framework on
# the target (SKIP_INSTALL = YES among them), and a target setting wins over a project setting.
settings:
  groups:
    - Distribution

targets:
  SerialPortSwift:
    type: framework
    platform: macOS
    sources:
      - path: Sources/SerialPortSwift
    settings:
      groups:
        - Distribution
    # Generates a shared scheme named after the target. Its archive action uses the Release configuration.
    scheme:
      gatherCoverageData: false

  SerialPortSwiftSimulation:
    type: framework
    platform: macOS
    sources:
      - path: Sources/SerialPortSwiftSimulation
    dependencies:
      # Linked, not embedded: an app that uses the simulation module embeds SerialPortSwift itself.
      - target: SerialPortSwift
        embed: false
    settings:
      groups:
        - Distribution
    scheme:
      gatherCoverageData: false

  SerialPortSwiftConcurrency:
    type: framework
    platform: macOS
    sources:
      - path: Sources/SerialPortSwiftConcurrency
    dependencies:
      # Linked, not embedded: an app that uses the concurrency module embeds SerialPortSwift itself.
      - target: SerialPortSwift
        embed: false
    settings:
      groups:
        - Distribution
      # Its own minimum: Swift concurrency needs macOS 10.15. Settings merge in the order groups, base, configs, so
      # this wins over the 10.11 of the Distribution group.
      base:
        MACOSX_DEPLOYMENT_TARGET: "10.15"
    scheme:
      gatherCoverageData: false
