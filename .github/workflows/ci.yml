name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-swift-5_1:
    name: Linux, Swift 5.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and test with the oldest supported compiler
        run: docker run --rm -v "$PWD:/src" -w /src swift:5.1 swift test --enable-test-discovery

  linux-swift-6:
    name: Linux, Swift 6.0
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v5
      - name: Build and test
        run: swift test

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version
      - name: Build and test
        run: swift test
      - name: Type-check against macOS 10.11
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          OUT="$RUNNER_TEMP/modules"
          mkdir -p "$OUT"
          xcrun swiftc -parse-as-library -emit-module -module-name SerialPortSwift \
            -target x86_64-apple-macosx10.11 -sdk "$SDK" \
            -emit-module-path "$OUT/SerialPortSwift.swiftmodule" \
            $(find Sources/SerialPortSwift -name '*.swift')
          xcrun swiftc -parse-as-library -typecheck -module-name SerialPortSwiftSimulation \
            -target x86_64-apple-macosx10.11 -sdk "$SDK" -I "$OUT" \
            $(find Sources/SerialPortSwiftSimulation -name '*.swift')

  frameworks:
    name: XCFrameworks (macOS 10.11)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        # The newest installed release Xcode that is not newer than the limit in Scripts/select-xcode.sh.
        run: |
          developer_dir="$(Scripts/select-xcode.sh)"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build, verify and zip the XCFrameworks
        run: Scripts/build-xcframeworks.sh
      - name: Upload the XCFrameworks
        # The zips, not the folders: the symbolic links inside a framework do not survive an artifact upload.
        uses: actions/upload-artifact@v5
        with:
          name: xcframeworks
          path: |
            build/xcframeworks/*.zip
            build/xcframeworks/*.zip.sha256
          compression-level: 0
          if-no-files-found: error
