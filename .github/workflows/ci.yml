name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-swift-5_1:
    name: Linux, Swift 5.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and test with the oldest supported compiler
        run: docker run --rm -v "$PWD:/src" -w /src swift:5.1 swift test --enable-test-discovery

  linux-swift-6:
    name: Linux, Swift 6.0
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v5
      - name: No continuation wrappers in SerialPortSwiftConcurrency
        # The channel is written with native concurrency only (see "The concurrency product" in CONTRIBUTING.md).
        # A line that is only a comment may name the wrappers, to forbid them; any other line that does fails.
        run: |
          dir=Sources/SerialPortSwiftConcurrency
          if [ ! -d "$dir" ]; then
            echo "::error::$dir does not exist, so this check would look at nothing."
            exit 1
          fi
          # grep exits 1 when it finds nothing, which is a pass here, and 2 when it fails, which is not.
          status=0
          found="$(grep -rnE 'with(Checked|Unsafe)(Throwing)?Continuation' "$dir")" || status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error::grep failed with exit status $status."
            exit 1
          fi
          matches="$(printf '%s\n' "$found" | grep -vE '^[^:]*:[0-9]+:[[:space:]]*//' || true)"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            printf '%s\n' "$matches" | while IFS=: read -r file line _; do
              echo "::error file=$file,line=$line::withChecked/withUnsafe(Throwing)Continuation is not allowed in SerialPortSwiftConcurrency. Use native concurrency: an actor, AsyncStream, Task."
            done
            exit 1
          fi
          echo "No continuation wrappers in $dir."
      - name: Build and test
        run: swift test

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version
      - name: Build and test
        run: swift test
      - name: Type-check against macOS 10.11
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          OUT="$RUNNER_TEMP/modules"
          mkdir -p "$OUT"
          xcrun swiftc -parse-as-library -emit-module -module-name SerialPortSwift \
            -target x86_64-apple-macosx10.11 -sdk "$SDK" \
            -emit-module-path "$OUT/SerialPortSwift.swiftmodule" \
            $(find Sources/SerialPortSwift -name '*.swift')
          xcrun swiftc -parse-as-library -typecheck -module-name SerialPortSwiftSimulation \
            -target x86_64-apple-macosx10.11 -sdk "$SDK" -I "$OUT" \
            $(find Sources/SerialPortSwiftSimulation -name '*.swift')

  frameworks:
    name: XCFrameworks (macOS 10.11)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        # The newest installed release Xcode that is not newer than the limit in Scripts/select-xcode.sh.
        run: |
          developer_dir="$(Scripts/select-xcode.sh)"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build, verify and zip the XCFrameworks
        run: Scripts/build-xcframeworks.sh
      - name: Upload the XCFrameworks
        # The zips, not the folders: the symbolic links inside a framework do not survive an artifact upload.
        # The patterns take all three frameworks (SerialPortSwift, SerialPortSwiftSimulation, SerialPortSwiftConcurrency).
        uses: actions/upload-artifact@v5
        with:
          name: xcframeworks
          path: |
            build/xcframeworks/*.zip
            build/xcframeworks/*.zip.sha256
          compression-level: 0
          if-no-files-found: error
